<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>③ 吃東西怎麼選？｜痛風衛教</title><style>
:root{--ink:#153d6a;--muted:#687482;--line:#eadfd2;--cream:#fffaf3;--red:#d94338}
*{box-sizing:border-box}body{margin:0;background:#fffaf3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:auto;padding:14px 14px 34px}.hero{background:linear-gradient(135deg,#f36a3e,#db3f46);color:white;border-radius:24px;padding:18px 20px}.hero h1{font-size:30px;margin:0}.hero p{font-size:18px;margin:6px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.tile{background:white;border:1px solid var(--line);border-radius:20px;padding:9px;text-decoration:none;color:var(--ink)}.tile.water{border:2px solid #e75b52;background:#fff8f6}
.tile img{width:100%;height:118px;object-fit:contain;display:block;border-radius:14px;background:#fffdf9}.tile b{display:block;text-align:center;font-size:21px;margin-top:7px}.tile small{display:block;text-align:center;color:var(--muted);font-size:15px}
.page{background:white;border:1px solid var(--line);border-radius:22px;padding:17px}.page h1{font-size:28px;margin:0 0 10px}.heroimg{width:100%;max-height:250px;object-fit:contain;display:block;border-radius:16px;background:#fffdf9;margin-bottom:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.target{border-radius:16px;padding:13px;text-align:center;border:1px solid var(--line);background:#fffaf0}.target b{display:block;font-size:17px}.target strong{font-size:37px;display:block}.blue{background:#eef5fb}.pink{background:#fff0f0}.green{background:#eef8ed}
.note{border-radius:15px;padding:13px;margin-top:12px;font-size:18px}.warn{background:#fff0ec;border:2px solid #e45b50;color:#a8322a}.info{background:#eef5fb;border:1px solid #c9ddec}.lead{font-size:20px}.food{border-radius:15px;padding:13px;margin:10px 0;font-size:18px}.avoid{background:#fff0ed}.limit{background:#fff7e5}.choose{background:#eef8ed}
.listen{width:100%;border:1px solid #efc45e;background:#fff3cf;color:var(--ink);border-radius:16px;padding:13px;font-size:19px;font-weight:800;margin-top:14px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:13px}.nav a{text-decoration:none;text-align:center;background:#173f6b;color:#fff;padding:11px 5px;border-radius:13px;font-weight:800}.nav .home{background:#ef6941}
ul{font-size:19px;padding-left:23px}li{margin:8px 0}.lifestyle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lifestyle div{background:#f6f8fa;border-radius:12px;padding:10px;text-align:center;font-size:16px}
.status{font-size:14px;text-align:center;color:var(--muted);padding:8px}.tiny{font-size:13px;color:#7c858e;text-align:center}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.tile img{height:135px}}
</style></head><body><main class="wrap"><section class="page"><img class="heroimg" src="assets/food_v2.png"><h1>③ 吃東西怎麼選？</h1>
<div class="food avoid"><strong>🔴 少吃／避免：</strong><br>內臟類、濃肉湯或火鍋湯、酒類（特別是啤酒）、大量海鮮。</div>
<div class="food limit"><strong>🟡 少一點、控制量：</strong><br>紅肉（牛、豬、羊）、魚類、貝類。</div>
<div class="food choose"><strong>🟢 可以吃、多選擇：</strong><br>蛋、牛奶與乳製品、蔬菜、適量的飯。</div><button class="listen" data-speak="飲食記住三件事。內臟、濃肉湯、火鍋湯、酒類，特別是啤酒，以及大量海鮮要少吃或避免。紅肉、魚類和貝類要控制份量。蛋、牛奶乳製品、蔬菜和適量的飯可以選擇。">🔊 點一下，聽醫師說</button></section><nav class="nav"><a href="pain.html">← 上一題</a><a class="home" href="index.html">⌂ 回首頁</a><a href="water.html">下一題 →</a></nav><div id="status" class="status">語音尚未播放</div><p class="tiny">一般衛教資訊；實際治療、用藥與飲水量請依醫療團隊指示。</p></main><script>(()=>{const s=document.getElementById('status'),ok='speechSynthesis'in window;function voice(){return speechSynthesis.getVoices().find(v=>/zh-TW/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang))}document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{if(!ok){s.textContent='此裝置目前不支援語音朗讀';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(b.dataset.speak),v=voice();if(v)u.voice=v;u.lang='zh-TW';u.rate=.86;u.onstart=()=>s.textContent='🔊 正在播放…';u.onend=()=>s.textContent='✓ 播放完成';speechSynthesis.speak(u)})})();</script></body></html>
