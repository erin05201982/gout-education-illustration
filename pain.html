</style></head><body><main class="wrap"><section class="page"><img class="heroimg" src="assets/pain_v2.png"><h1>② 痛風會痛哪裡？</h1>
<p class="lead"><strong>發作時常見：紅、腫、熱、痛。</strong></p>
<div class="note info"><strong>★ 最常見：</strong>大拇趾根部（第一蹠趾關節）</div>
<ul><li>腳踝</li><li>膝蓋</li><li>手指、手腕</li><li>手肘</li><li>耳朵：可能出現痛風石</li></ul>
<p class="lead">所以痛風<strong>不只會痛腳趾</strong>。</p><button class="listen" data-speak="痛風發作時常會紅、腫、熱、痛。最常見的位置是大拇趾根部，也就是第一蹠趾關節。也可能出現在腳踝、膝蓋、手指、手腕、手肘，耳朵也可能出現痛風石。">🔊 點一下，聽醫師說</button></section><nav class="nav"><a href="uric.html">← 上一題</a><a class="home" href="index.html">⌂ 回首頁</a><a href="food.html">下一題 →</a></nav><div id="status" class="status">語音尚未播放</div><p class="tiny">一般衛教資訊；實際治療、用藥與飲水量請依醫療團隊指示。</p></main><script>(()=>{const s=document.getElementById('status'),ok='speechSynthesis'in window;function voice(){return speechSynthesis.getVoices().find(v=>/zh-TW/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang))}document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{if(!ok){s.textContent='此裝置目前不支援語音朗讀';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(b.dataset.speak),v=voice();if(v)u.voice=v;u.lang='zh-TW';u.rate=.86;u.onstart=()=>s.textContent='🔊 正在播放…';u.onend=()=>s.textContent='✓ 播放完成';speechSynthesis.speak(u)})})();</script></body></html>
