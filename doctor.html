<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>何時就醫？｜林祐賸醫師衛教</title><style>
:root{
 --ink:#113d70;--muted:#637184;--line:#d9e4ef;--bg:#f7fbff;
 --green:#176d45;--orange:#f26d21;--red:#d84335;--blue:#0f5aa6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.45}
.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;border-left:1px solid #e7eef5;border-right:1px solid #e7eef5}
.topbar{position:sticky;top:0;z-index:10;background:#f4f9ff;border-bottom:1px solid #e2edf7;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.topbar a{text-decoration:none;color:var(--ink);font-weight:800}.topbar .title{font-size:18px;font-weight:900}.homeicon{font-size:25px}
main{padding:16px}
.hero{text-align:center;padding:8px 6px 4px}.hero h1{font-size:34px;margin:0}.hero h2{font-size:23px;margin:5px 0 0;color:#7d2a1f}
.doctor-card{display:flex;align-items:center;gap:12px;background:#eef6ff;border:1px solid #cfe0f2;border-radius:18px;padding:12px;margin:12px 0}
.doctor-card img{width:92px;height:92px;object-fit:contain}.doctor-card b{font-size:21px}.doctor-card p{font-size:16px;margin:4px 0 0;color:#47586b}
.section-title{text-align:center;font-size:22px;font-weight:900;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;min-height:175px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tile img{width:100%;height:96px;object-fit:contain;display:block}.tile b{display:block;text-align:center;font-size:19px}.tile small{display:block;text-align:center;color:var(--muted)}
.tip-card{display:flex;gap:10px;align-items:center;background:#fff7ea;border:1px solid #f2dcc0;border-radius:18px;padding:12px;margin:15px 0}.tip-card img{width:76px;height:76px;object-fit:contain}.tip-card b{font-size:19px}
.page-title{display:flex;align-items:center;gap:10px;margin:4px 0 10px}.num{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;font-size:23px}.page-title h1{font-size:28px;margin:0}
.audio{width:100%;border:0;border-radius:18px;background:linear-gradient(135deg,#0d5ea9,#093d78);color:white;padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin:10px 0 14px}
.audio img{width:72px;height:72px;object-fit:contain}.audio .speaker{font-size:38px}.audio .copy{text-align:left}.audio .copy small{display:block;color:#dceaff;font-size:14px}.audio .copy strong{display:block;color:#ffd43b;font-size:24px;line-height:1.1}
.info{background:#eef6ff;border:1px solid #cfe0f2;border-radius:16px;padding:13px;font-size:18px;margin:10px 0}.warn{background:#fff1ee;border:2px solid #ef766d;color:#a32e27}
.uric-title{text-align:center;font-size:21px;font-weight:900;margin:16px 0 10px}.targets{display:grid;grid-template-columns:1fr 1fr;gap:9px}.target{border-radius:16px;padding:12px;text-align:center;border:1px solid #e4e0d6}.target b{display:block;font-size:16px}.target strong{display:block;font-size:37px;line-height:1.05;margin:5px 0}.t1{background:#fff4d8}.t2{background:#eef3ff}.t3{background:#fff0f0}.t4{background:#edf8ec}
.pain-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:10px;align-items:start}.pain-hero .big{background:#fffaf1;border-radius:18px;padding:6px}.pain-hero .big img{width:100%;height:300px;object-fit:contain}
.site-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.site{background:#fff;border:1px solid #d7e6da;border-radius:16px;padding:8px;text-align:center}.site img{width:100%;height:100px;object-fit:contain}.site b{display:block;color:var(--green);font-size:17px}
.highlight{background:#f3faf2;border:1px solid #d2e7cf;border-radius:16px;padding:12px;font-size:18px;margin:10px 0}.highlight strong{color:#c52920}
.food{border-radius:16px;padding:13px;margin:9px 0;font-size:18px}.avoid{background:#fff0ed}.limit{background:#fff8e7}.choose{background:#eef8ed}
ul{font-size:18px;padding-left:22px}li{margin:7px 0}
.lifestyle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lifestyle div{background:#f4f7fa;border-radius:12px;padding:10px;text-align:center}
.navbar{position:sticky;bottom:0;background:#fff;border-top:1px solid #dde8f1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 6px}.navbar a{text-decoration:none;text-align:center;color:#4c5b6d;font-weight:700}.navbar .active{color:#fff;background:var(--blue);border-radius:50%;width:32px;height:32px;line-height:32px;margin:auto}.navbar .home{font-size:22px}
.status{text-align:center;color:var(--muted);font-size:13px;padding:5px}.footnote{text-align:center;color:#7a8794;font-size:12px;padding:10px 14px 18px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.tile img{height:112px}}
</style></head><body><div class="app">
<header class="topbar"><a href="index.html">← 回首頁</a><span class="title">⑥ 何時就醫？</span><a class="homeicon" href="index.html">⌂</a></header>
<main><div class="page-title"><span class="num">⑥</span><h1>何時就醫？</h1></div>
<button class="audio" data-speak="如果關節紅腫熱痛很嚴重，影響行走，或有發燒寒顫、全身不舒服、尿量明顯變少、尿色變深或血尿，或出現疑似痛風石的硬塊，請儘速就醫。平時要定期回診、維持理想體重、規律運動、戒菸少酒並遵從醫囑。" aria-label="聽林醫師說"><img src="assets/doctor_avatar.png" alt=""><span class="speaker">🔊</span><span class="copy"><small>點一下</small><strong>聽林醫師說</strong></span></button>

<div class="info warn"><strong>出現下列情況，請儘速就醫：</strong></div>
<ul><li>關節紅、腫、熱、痛很嚴重，影響行走或日常生活</li><li>發燒、寒顫、全身不舒服</li><li>尿量明顯變少、顏色變深或出現血尿</li><li>出現硬塊，可能是痛風石</li></ul>
<div class="section-title">林醫師的小提醒</div>
<div class="lifestyle"><div>📅 定期回診<br>追蹤尿酸</div><div>⚖️ 維持理想體重</div><div>👟 規律運動</div><div>🚭 戒菸、少酒</div><div>📋 遵從醫囑<br>規律用藥</div></div>
<div id="status" class="status">語音尚未播放</div></main><nav class="navbar"><a class="home" href="index.html">⌂</a><a class="" href="uric.html">1</a><a class="" href="pain.html">2</a><a class="" href="food.html">3</a><a class="" href="water.html">4</a><a class="" href="medicine.html">5</a><a class="active" href="doctor.html">6</a></nav>
<div class="footnote">一般衛教資訊；實際治療、用藥與飲水量請依個別醫療團隊指示。</div></div>
<script>
(()=>{
 const st=document.getElementById('status');
 const ok='speechSynthesis'in window&&'SpeechSynthesisUtterance'in window;
 function voice(){return speechSynthesis.getVoices().find(v=>/zh-TW/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang))}
 document.querySelectorAll('[data-speak]').forEach(btn=>btn.onclick=()=>{
   if(!ok){if(st)st.textContent='此裝置目前不支援語音朗讀';return}
   speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(btn.dataset.speak); const v=voice(); if(v)u.voice=v;
   u.lang='zh-TW';u.rate=.86;
   u.onstart=()=>{if(st)st.textContent='🔊 林醫師正在說明…'};
   u.onend=()=>{if(st)st.textContent='✓ 播放完成'};
   u.onerror=()=>{if(st)st.textContent='語音播放失敗，請再試一次'};
   speechSynthesis.speak(u);
 })})();
</script>
</body></html>
