<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⑥ 什麼時候要趕快就醫？｜痛風衛教</title><style>

.note{border-radius:15px;padding:13px;margin-top:12px;font-size:18px}.warn{background:#fff0ec;border:2px solid #e45b50;color:#a8322a}.info{background:#eef5fb;border:1px solid #c9ddec}.lead{font-size:20px}.food{border-radius:15px;padding:13px;margin:10px 0;font-size:18px}.avoid{background:#fff0ed}.limit{background:#fff7e5}.choose{background:#eef8ed}

</style></head><body><main class="wrap"><section class="page"><img class="heroimg" src="assets/doctor_v2.png"><h1>⑥ 什麼時候要趕快就醫？</h1>
<p class="lead"><strong>出現下列情況，請儘速就醫：</strong></p>
<ul><li>關節紅、腫、熱、痛很嚴重，影響行走或日常生活</li><li>發燒、寒顫、全身不舒服</li><li>尿量明顯變少、顏色變深或出現血尿</li><li>出現硬塊，可能是痛風石</li></ul>
<h2 style="font-size:22px;margin-top:16px">生活管理小提醒</h2>
<div class="lifestyle"><div>📅 定期回診<br>追蹤尿酸</div><div>⚖️ 維持理想體重<br>避免肥胖</div><div>👟 規律運動<br>避免劇烈運動</div><div>🚭 戒菸、少酒<br>保護心腎</div><div>📋 遵從醫囑<br>規律用藥</div></div><button class="listen" data-speak="如果關節紅腫熱痛很嚴重，影響行走，或有發燒寒顫、全身不舒服、尿量明顯變少、尿色變深或血尿，或出現疑似痛風石的硬塊，請儘速就醫。平時要定期回診、維持理想體重、規律運動、戒菸少酒並遵從醫囑。">🔊 點一下，聽醫師說</button></section><nav class="nav"><a href="medicine.html">← 上一題</a><a class="home" href="index.html">⌂ 回首頁</a><a href="uric.html">下一題 →</a></nav><div id="status" class="status">語音尚未播放</div><p class="tiny">一般衛教資訊；實際治療、用藥與飲水量請依醫療團隊指示。</p></main><script>(()=>{const s=document.getElementById('status'),ok='speechSynthesis'in window;function voice(){return speechSynthesis.getVoices().find(v=>/zh-TW/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang))}document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{if(!ok){s.textContent='此裝置目前不支援語音朗讀';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(b.dataset.speak),v=voice();if(v)u.voice=v;u.lang='zh-TW';u.rate=.86;u.onstart=()=>s.textContent='🔊 正在播放…';u.onend=()=>s.textContent='✓ 播放完成';speechSynthesis.speak(u)})})();</script></body></html>
