<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>何時就醫？｜林祐賸醫師衛教</title><style>

.page-title{display:flex;align-items:center;gap:10px;margin:3px 0 8px}.num{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-weight:900;font-size:23px}.page-title h1{font-size:28px;margin:0}
.audio{width:100%;display:flex;align-items:center;gap:13px;border:0;border-radius:20px;padding:10px 15px;background:linear-gradient(135deg,#0e5da8,#0a3d75);color:#fff;margin:8px 0 15px;cursor:pointer;text-align:left}
.audio img{width:68px;height:68px;object-fit:cover;border-radius:50%;flex:0 0 68px}.audio .speaker{font-size:36px}.audio small{display:block;font-size:14px;color:#dcecff}.audio strong{display:block;color:#ffd33d;font-size:24px;line-height:1.1}

<header class="topbar"><a href="index.html">← 回首頁</a><span class="title">⑥ 何時就醫？</span><a class="homeicon" href="index.html">⌂</a></header>
<main><div class="page-title"><span class="num">⑥</span><h1>何時就醫？</h1></div>
<button class="audio" data-speak="如果關節紅腫熱痛很嚴重，影響行走，或有發燒寒顫、全身不舒服、尿量明顯變少、尿色變深或血尿，或出現疑似痛風石的硬塊，請儘速就醫。平時要定期回診、維持理想體重、規律運動、戒菸少酒並遵從醫囑。" aria-label="聽林醫師說"><img src="assets/doctor_avatar.png" alt=""><span class="speaker">🔊</span><span class="copy"><small>點一下</small><strong>聽林醫師說</strong></span></button>

<div class="info warn"><strong>出現下列情況，請儘速就醫：</strong></div>
<ul><li>關節紅、腫、熱、痛很嚴重，影響行走或日常生活</li><li>發燒、寒顫、全身不舒服</li><li>尿量明顯變少、顏色變深或出現血尿</li><li>出現硬塊，可能是痛風石</li></ul>
<div class="section-title">林醫師的小提醒</div>
<div class="lifestyle"><div>📅 定期回診<br>追蹤尿酸</div><div>⚖️ 維持理想體重</div><div>👟 規律運動</div><div>🚭 戒菸、少酒</div><div>📋 遵從醫囑<br>規律用藥</div></div>
<div id="status" class="status">語音尚未播放</div></main><nav class="navbar"><a class="home" href="index.html">⌂</a><a class="" href="uric.html">1</a><a class="" href="pain.html">2</a><a class="" href="food.html">3</a><a class="" href="water.html">4</a><a class="" href="medicine.html">5</a><a class="active" href="doctor.html">6</a></nav>
<div class="footnote">一般衛教資訊；實際治療、用藥與飲水量請依個別醫療團隊指示。</div></div>
<script>
(()=>{
 const st=document.getElementById('status');
 const ok='speechSynthesis'in window&&'SpeechSynthesisUtterance'in window;
 function voice(){return speechSynthesis.getVoices().find(v=>/zh-TW/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang))}
 document.querySelectorAll('[data-speak]').forEach(btn=>btn.onclick=()=>{
   if(!ok){if(st)st.textContent='此裝置目前不支援語音朗讀';return}
   speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(btn.dataset.speak); const v=voice(); if(v)u.voice=v;
   u.lang='zh-TW';u.rate=.86;
   u.onstart=()=>{if(st)st.textContent='🔊 林醫師正在說明…'};
   u.onend=()=>{if(st)st.textContent='✓ 播放完成'};
   u.onerror=()=>{if(st)st.textContent='語音播放失敗，請再試一次'};
   speechSynthesis.speak(u);
 })})();
</script>
