<script>
(()=>{const s=document.getElementById('status');const ok='speechSynthesis'in window&&'SpeechSynthesisUtterance'in window;
function v(){return speechSynthesis.getVoices().find(x=>/zh-TW/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^zh/i.test(x.lang))}
document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{if(!ok){s.textContent='這台裝置目前不支援語音朗讀。';return}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.speak);const vv=v();if(vv)u.voice=vv;u.lang='zh-TW';u.rate=.86;
u.onstart=()=>s.textContent='🔊 正在播放衛教內容…';u.onend=()=>s.textContent='✓ 播放完成';u.onerror=()=>s.textContent='語音播放失敗，請再試一次。';speechSynthesis.speak(u)})})();
</script>
