<main><div class="page-title"><span class="num">①</span><h1>尿酸要多少？</h1></div>
<button class="audio" data-speak="尿酸高不一定等於痛風。一般參考值大約七毫克每分升；已經有痛風的人，通常控制在六以下；有痛風石或嚴重痛風，通常控制在五以下；腎病或心臟病合併痛風，通常控制在六以下。只有高尿酸、沒有痛風時，請由醫師評估是否需要藥物。" aria-label="聽林醫師說"><img src="assets/doctor_avatar.png" alt=""><span class="speaker">🔊</span><span class="copy"><small>點一下</small><strong>聽林醫師說</strong></span></button>

<div class="info"><strong>高尿酸 ≠ 痛風。</strong><br>尿酸高不一定會痛；但控制在合適目標，有助降低痛風發作與併發症。</div>
<div class="uric-title">尿酸多少才適合？　<small>單位：mg/dL</small></div>
<div class="targets">
 <div class="target t1"><b>一般參考值</b><strong>約 7</strong>mg/dL</div>
 <div class="target t2"><b>已有痛風</b><strong>&lt; 6</strong>mg/dL</div>
 <div class="target t3"><b>痛風石／<br>嚴重痛風</b><strong>&lt; 5</strong>mg/dL</div>
 <div class="target t4"><b>腎病／心臟病<br>＋ 痛風</b><strong>通常 &lt; 6</strong>mg/dL</div>
</div>
<div class="info warn"><strong>只有高尿酸、沒有痛風時</strong>，通常不需自行開始吃藥；請依醫師建議追蹤與評估。</div>
<div id="status" class="status">語音尚未播放</div></main><nav class="navbar"><a class="home" href="index.html">⌂</a><a class="active" href="uric.html">1</a><a class="" href="pain.html">2</a><a class="" href="food.html">3</a><a class="" href="water.html">4</a><a class="" href="medicine.html">5</a><a class="" href="doctor.html">6</a></nav>
<div class="footnote">一般衛教資訊；實際治療、用藥與飲水量請依個別醫療團隊指示。</div></div>
<script>
(()=>{
 const st=document.getElementById('status');
 const ok='speechSynthesis'in window&&'SpeechSynthesisUtterance'in window;
 function voice(){return speechSynthesis.getVoices().find(v=>/zh-TW/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang))}
 document.querySelectorAll('[data-speak]').forEach(btn=>btn.onclick=()=>{
   if(!ok){if(st)st.textContent='此裝置目前不支援語音朗讀';return}
   speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(btn.dataset.speak); const v=voice(); if(v)u.voice=v;
   u.lang='zh-TW';u.rate=.86;
   u.onstart=()=>{if(st)st.textContent='🔊 林醫師正在說明…'};
   u.onend=()=>{if(st)st.textContent='✓ 播放完成'};
   u.onerror=()=>{if(st)st.textContent='語音播放失敗，請再試一次'};
   speechSynthesis.speak(u);
 })})();
</script>
