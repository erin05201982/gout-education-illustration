<main class="wrap">

<img class="heroicon" src="assets/home_uric.png" alt="① 尿酸要多少？">
<h1>① 尿酸要多少？</h1>
<div class="audio-wrap">
<button class="audio-image-btn" data-speak="尿酸高不一定等於痛風。一般參考值大約七毫克每分升；已經有痛風的人，通常控制在六以下；有痛風石或嚴重痛風，可能需要控制在五以下；腎病或心臟病合併痛風，通常控制在六以下。只有高尿酸、沒有痛風時，請由醫師評估是否需要藥物。" aria-label="點一下，聽醫師說">
<img src="assets/audio_button.png" alt="點一下，聽醫師說">
</button>
</div>
<div class="audio-hint">看到醫師＋喇叭，就可以點來聽</div>

<p class="lead"><strong>高尿酸 ≠ 痛風。</strong>尿酸高不一定會痛；但控制在合適目標，有助降低痛風發作與併發症。</p>
<div class="cards">
<div class="target"><b>一般參考值</b><strong>約 7</strong>mg/dL</div>
<div class="target blue"><b>已有痛風</b><strong>&lt; 6</strong>mg/dL</div>
<div class="target pink"><b>痛風石／嚴重痛風</b><strong>&lt; 5</strong>mg/dL</div>
<div class="target green"><b>腎病／心臟病＋痛風</b><strong>通常 &lt; 6</strong>mg/dL</div>
</div>
<div class="note warn"><strong>只有高尿酸、沒有痛風時</strong>，通常不需自行開始吃藥；請依醫師建議追蹤與評估。</div>
</section>

<div id="status" class="status">語音尚未播放</div>
<p class="tiny">一般衛教資訊；實際治療、用藥與飲水量請依醫療團隊指示。</p>
</main>
<script>
(()=>{
  const s=document.getElementById('status');
  const ok='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function voice(){
    return speechSynthesis.getVoices().find(v=>/zh-TW/i.test(v.lang))
      || speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang));
  }
  document.querySelectorAll('[data-speak]').forEach(b=>{
    b.onclick=()=>{
      if(!ok){ if(s) s.textContent='此裝置目前不支援語音朗讀'; return; }
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(b.dataset.speak);
      const v=voice(); if(v) u.voice=v;
      u.lang='zh-TW'; u.rate=.86;
      u.onstart=()=>{ if(s) s.textContent='🔊 正在播放…'; };
      u.onend=()=>{ if(s) s.textContent='✓ 播放完成'; };
      u.onerror=()=>{ if(s) s.textContent='語音播放失敗，請再試一次'; };
      speechSynthesis.speak(u);
    };
  });
})();
</script>
